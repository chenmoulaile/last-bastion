name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  headless-tests:
    name: Godot 4.7.2 headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          curl -L --fail -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import project
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import

      - name: Smoke test
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/smoke.tscn

      - name: Campaign test
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/campaign.tscn

      - name: Integration test
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/integration.tscn

      - name: Narrative test
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/narrative.tscn
